
name: Inspect Content Fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect contentType field
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs/promises';
          import { fetchByActress } from './src/fanza-client.js';

          const actresses = JSON.parse(
            await fs.readFile('monitor-actresses.json', 'utf8')
          );

          const counts = new Map();

          for (const actress of actresses.slice(0, 5)) {
            const result = await fetchByActress(actress.id, 20);

            for (const work of result.contents || []) {
              const type = JSON.stringify(work.contentType) ?? 'undefined';
              counts.set(type, (counts.get(type) || 0) + 1);
            }

            await new Promise(r => setTimeout(r, 500));
          }

          console.log('\n=== Content Type Summary ===');

          for (const [type, count] of counts) {
            console.log(`${type}: ${count}`);
          }
          EOF
