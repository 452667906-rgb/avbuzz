
name: Inspect Content Fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect GraphQL schema
        run: |
          node --input-type=module <<'EOF'
          const query = `
            {
              __schema {
                types {
                  name
                  kind
                  fields {
                    name
                    type {
                      name
                      kind
                      ofType {
                        name
                        kind
                      }
                    }
                  }
                  enumValues {
                    name
                  }
                }
              }
            }
          `;

          const response = await fetch(
            'https://api.video.dmm.co.jp/graphql',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ query })
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const result = await response.json();

          if (result.errors) {
            console.log(JSON.stringify(result.errors, null, 2));
            process.exit(1);
          }

          for (const type of result.data.__schema.types) {
            if (type.name.startsWith('__')) continue;

            console.log(`\nTYPE: ${type.name}`);

            for (const field of type.fields || []) {
              console.log(
                `  ${field.name}: ${field.type.name || field.type.ofType?.name || field.type.kind}`
              );
            }

            for (const value of type.enumValues || []) {
              console.log(`  ENUM: ${value.name}`);
            }
          }
          EOF
