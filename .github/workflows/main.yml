
name: FANZA Actress Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Search actress
        run: |
          node --input-type=module <<'EOF'
          import { searchActress, fetchByActress } from './src/fanza-client.js';

          const name = '九野ひなの';

          try {
            const result = await searchActress(name);

            console.log('Matching actresses:');
            console.log(JSON.stringify(result.actresses, null, 2));

            const actress = result.actresses.find(a => a.name === name);

            if (!actress) {
              console.error('Exact actress match not found');
              process.exitCode = 1;
            } else {
              console.log('Actress ID:', actress.id);

              const works = await fetchByActress(actress.id, 5);
              console.log('Total works:', works.totalCount);
              console.log('Returned works:', works.contents.length);
              console.log('Work IDs:', works.contents.map(w => w.id));
            }
          } catch (error) {
            console.error('Test failed:', error.message);
            process.exitCode = 1;
          }
          EOF
