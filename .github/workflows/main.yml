
name: FANZA API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test FANZA API
        run: |
          node --input-type=module <<'EOF'
          import { fetchRanking } from './src/fanza-client.js';

          try {
            const result = await fetchRanking('sales', 3);
            console.log('FANZA API request succeeded');
            console.log('Number of returned works:', result.contents.length);
            console.log('Total matching works:', result.totalCount);
          } catch (error) {
            console.error('FANZA API request failed:', error.message);
            process.exitCode = 1;
          }
          EOF
