
name: FANZA Daily Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: fanza-daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run FANZA monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node monitor.js

      - name: Save monitoring records
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FANZA monitoring records"
            git push
          fi

  discord-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send test notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'EOF'
          import { fetchByActress } from './src/fanza-client.js';

          const result = await fetchByActress('1078407', 1);
          const work = result.contents[0];

          if (!work) {
            throw new Error('No works returned');
          }

          const embed = {
            title: `[测试] ${work.title}`,
            url: `https://www.dmm.co.jp/digital/videoa/-/detail/=/cid=${encodeURIComponent(work.id)}/`,
            description: `演员：九野ひなの\n作品 ID：${work.id}`,
            color: 0xE91E63,
            fields: [
              {
                name: 'FANZA 日期',
                value: work.deliveryStartAt || '未知',
                inline: true
              }
            ],
            ...(work.packageImage?.largeUrl
              ? { image: { url: work.packageImage.largeUrl } }
              : {})
          };

          const response = await fetch(
            process.env.DISCORD_WEBHOOK_URL,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ embeds: [embed] })
            }
          );

          if (!response.ok) {
            throw new Error(`Discord HTTP ${response.status}: ${await response.text()}`);
          }

          console.log('Discord test notification sent successfully');
          EOF
